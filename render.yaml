services:
  - type: web
    name: rm-quality-api
    env: docker
    plan: free # Note: The free plan has 512MB RAM, which might cause OOM crashes with PyTorch/BGE models
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: RM_API_KEY
        generateValue: true # Generates a random API key for you automatically
      - key: RM_PORT
        value: 10000
      - key: PORT # Render uses the PORT environment variable
        value: 10000
